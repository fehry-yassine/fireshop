services:
  postgres:
    image: postgres:16-alpine
    container_name: localmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: localmarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d localmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

